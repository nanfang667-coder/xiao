<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>正在进入网站</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./entry.mjs"></script>
</head>
<body>
  <div class="preview" id="preview" hidden>效果预览 · 不会访问正式网站</div>
  <main>
    <div class="brand"><span class="brand-icon">↗</span> 网站入口</div>
    <section class="card" aria-labelledby="title">
      <div class="status-icon" aria-hidden="true">↗</div>
      <p class="eyebrow">即将抵达</p>
      <h1 id="title">正在准备访问</h1>
      <p class="description" id="description">请稍候，正在获取访问地址。</p>
      <div class="destination" id="destination-box" hidden>
        <span>即将前往</span>
        <strong id="destination"></strong>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <noscript><p class="error">自动跳转需要启用 JavaScript。请启用后重新打开原链接，以保留邀请来源。</p></noscript>
    </section>
    <p class="footnote">如果长时间未打开，请检查网络后重试。</p>
  </main>
</body>
</html>
